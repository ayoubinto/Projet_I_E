name: CI Backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest

    env:
      SECRET_KEY : ci-test-secret-key

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Vérifier Django
        run: python manage.py check

      - name: Lancer les tests
        run: pytest

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Build React
        run: npm run build

  docker-backend:
    runs-on: ubuntu-latest
    needs: [tests, frontend]

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Construire l'image Docker backend
        run: docker build -f deployment/Dockerfile.backend -t projet-ie-backend:test .

  docker-frontend:
    runs-on: ubuntu-latest
    needs: [ tests, frontend ]

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Construire l'image Docker frontend
        run: docker build -f deployment/Dockerfile.frondend -t projet-ie-frontend:test .
