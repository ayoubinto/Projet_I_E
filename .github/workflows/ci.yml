name: CI Backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest

    env:
      SECRET_KEY : ci-test-secret-key

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Vérifier Django
        run: python manage.py check

      - name: Lancer les backend
        run: pytest

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Build React
        run: npm run build

  docker-backend:
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Construire l'image Docker backend
        run: docker build -f deployment/Dockerfile.backend -t projet-ie-backend:test .

  docker-frontend:
    runs-on: ubuntu-latest
    needs: [ backend, frontend ]

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Construire l'image Docker frontend
        run: docker build -f deployment/Dockerfile.frontend -t projet-ie-frontend:test .

  publish-backend:
    needs:
      - backend
      - frontend
      - docker-backend
      - docker-frontend

    if: github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/Dockerfile.backend
          push: true
          tags: |
            ghcr.io/ayoubinto/projet_i_e-backend:latest
            ghcr.io/ayoubinto/projet_i_e-backend:${{ github.sha }}


  publish-frontend:
    needs:
      - backend
      - frontend
      - docker-backend
      - docker-frontend

    if: github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/Dockerfile.frontend
          push: true
          tags: |
            ghcr.io/ayoubinto/projet_i_e-frontend:latest
            ghcr.io/ayoubinto/projet_i_e-frontend:${{ github.sha }}